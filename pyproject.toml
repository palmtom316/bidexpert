[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidexpert"
version = "1.0.0"
description = "AI assisted tender system stage-1 implementation"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "python-docx>=1.1.2",
  "docxtpl>=0.19.0",
  "python-multipart>=0.0.19",
  "rapidfuzz>=3.11.0",
  "celery>=5.4.0",
  "redis>=5.2.1",
  "httpx>=0.28.1",
  "qdrant-client>=1.12.1",
  "prometheus-client>=0.22.1",
  "cryptography>=45.0.0",
  "pypdf>=5.1.0",
  "pymupdf>=1.25.1",
  "pillow>=11.0.0",
  "pytesseract>=0.3.13",
  "langextract>=1.1.1",
  "alembic>=1.13.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.3"
]

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
