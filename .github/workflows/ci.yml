name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      BIDEXPERT_APP_ENV: test
      BIDEXPERT_AUTH_MODE: api_key
      BIDEXPERT_API_KEY: ci-api-key
      BIDEXPERT_DATABASE_URL: sqlite+pysqlite:///./ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools pip-audit
          pip install -e .[dev]

      - name: Lint
        run: |
          ruff check app tests

      - name: Dependency security audit
        run: pip-audit

      - name: Migration up/down smoke test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Compose config check
        run: |
          docker compose config --quiet

      - name: Unit tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=60 tests app/tests

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bidexpert:ci-${{ github.sha }} .
