x-common-env: &common-env
  BIDEXPERT_APP_ENV: ${BIDEXPERT_APP_ENV:-dev}
  BIDEXPERT_DATABASE_URL: postgresql+psycopg://bidexpert:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bidexpert
  BIDEXPERT_MIN_MATRIX_COVERAGE: "0.9"
  BIDEXPERT_AUTH_MODE: ${BIDEXPERT_AUTH_MODE:-api_key}
  BIDEXPERT_JWT_SECRET: ${BIDEXPERT_JWT_SECRET:-}
  BIDEXPERT_JWT_ISSUER: ${BIDEXPERT_JWT_ISSUER:-}
  BIDEXPERT_JWT_AUDIENCE: ${BIDEXPERT_JWT_AUDIENCE:-}
  BIDEXPERT_API_RATE_LIMIT_ENABLED: ${BIDEXPERT_API_RATE_LIMIT_ENABLED:-true}
  BIDEXPERT_API_RATE_LIMIT_REQUESTS: ${BIDEXPERT_API_RATE_LIMIT_REQUESTS:-300}
  BIDEXPERT_API_RATE_LIMIT_WINDOW_SECONDS: ${BIDEXPERT_API_RATE_LIMIT_WINDOW_SECONDS:-60}
  BIDEXPERT_LOG_LEVEL: ${BIDEXPERT_LOG_LEVEL:-INFO}
  BIDEXPERT_LOG_FORMAT: ${BIDEXPERT_LOG_FORMAT:-json}
  BIDEXPERT_METRICS_ENABLED: ${BIDEXPERT_METRICS_ENABLED:-true}
  BIDEXPERT_METRICS_PUBLIC_ENABLED: ${BIDEXPERT_METRICS_PUBLIC_ENABLED:-false}
  BIDEXPERT_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  BIDEXPERT_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
  BIDEXPERT_QDRANT_URL: http://qdrant:6333
  BIDEXPERT_QDRANT_ENABLE_RERANK: ${BIDEXPERT_QDRANT_ENABLE_RERANK:-true}
  BIDEXPERT_QDRANT_RERANK_CANDIDATE_LIMIT: ${BIDEXPERT_QDRANT_RERANK_CANDIDATE_LIMIT:-24}
  BIDEXPERT_UPLOAD_DIR: /app/data/uploads
  BIDEXPERT_MAX_UPLOAD_BYTES: ${BIDEXPERT_MAX_UPLOAD_BYTES:-52428800}
  BIDEXPERT_OCR_PROVIDER: ${BIDEXPERT_OCR_PROVIDER:-tesseract}
  BIDEXPERT_HUNYUAN_OCR_API_KEY: ${BIDEXPERT_HUNYUAN_OCR_API_KEY:-}
  BIDEXPERT_HUNYUAN_OCR_BASE_URL: ${BIDEXPERT_HUNYUAN_OCR_BASE_URL:-}
  BIDEXPERT_DOCAI_OCR_API_KEY: ${BIDEXPERT_DOCAI_OCR_API_KEY:-}
  BIDEXPERT_DOCAI_OCR_BASE_URL: ${BIDEXPERT_DOCAI_OCR_BASE_URL:-}
  BIDEXPERT_MINERU_OCR_API_KEY: ${BIDEXPERT_MINERU_OCR_API_KEY:-}
  BIDEXPERT_MINERU_OCR_BASE_URL: ${BIDEXPERT_MINERU_OCR_BASE_URL:-}
  BIDEXPERT_MINERU_OCR_MODEL: ${BIDEXPERT_MINERU_OCR_MODEL:-mineru-ocr}
  BIDEXPERT_MASTER_KEY_B64: ${BIDEXPERT_MASTER_KEY_B64:-}
  BIDEXPERT_API_KEY: ${BIDEXPERT_API_KEY:-}
  BIDEXPERT_VAULT_REDIS_FALLBACK_ENABLED: ${BIDEXPERT_VAULT_REDIS_FALLBACK_ENABLED:-false}
  BIDEXPERT_SECRET_TEMP_KEY_TTL_SECONDS: ${BIDEXPERT_SECRET_TEMP_KEY_TTL_SECONDS:-3600}
  BIDEXPERT_OPENAI_API_KEY: ${BIDEXPERT_OPENAI_API_KEY:-}
  BIDEXPERT_OPENAI_BASE_URL: ${BIDEXPERT_OPENAI_BASE_URL:-https://api.openai.com/v1}
  BIDEXPERT_GEMINI_API_KEY: ${BIDEXPERT_GEMINI_API_KEY:-}
  BIDEXPERT_GEMINI_BASE_URL: ${BIDEXPERT_GEMINI_BASE_URL:-}
  BIDEXPERT_QWEN_API_KEY: ${BIDEXPERT_QWEN_API_KEY:-}
  BIDEXPERT_QWEN_BASE_URL: ${BIDEXPERT_QWEN_BASE_URL:-}
  BIDEXPERT_DEEPSEEK_API_KEY: ${BIDEXPERT_DEEPSEEK_API_KEY:-}
  BIDEXPERT_DEEPSEEK_BASE_URL: ${BIDEXPERT_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
  BIDEXPERT_VOYAGE_API_KEY: ${BIDEXPERT_VOYAGE_API_KEY:-}
  BIDEXPERT_VOYAGE_BASE_URL: ${BIDEXPERT_VOYAGE_BASE_URL:-https://api.voyageai.com/v1}

services:
  api:
    build: .
    expose:
      - "8000"
    stop_grace_period: 30s
    environment:
      <<: *common-env
      BIDEXPERT_SERVE_UI_STATIC: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request;req=urllib.request.Request('http://localhost:8000/health');key=(os.getenv('BIDEXPERT_API_KEY') or '').strip();req.add_header('X-API-Key', key) if key else None;urllib.request.urlopen(req, timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/app/data
      # Dev mode: uncomment to mount source for hot-reload
      # - ./app:/app/app

  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      api:
        condition: service_healthy
    command: >
      /bin/sh -ec '
      cert_file=/etc/nginx/certs/tls.crt;
      key_file=/etc/nginx/certs/tls.key;
      app_env="${BIDEXPERT_APP_ENV:-dev}";
      config_file=/etc/nginx/nginx.conf;
      if [ ! -s "$$cert_file" ] || [ ! -s "$$key_file" ]; then
        if [ "$$app_env" = "prod" ]; then
          echo "TLS certificate/key not found. Provide deploy/nginx/certs/tls.crt and tls.key in prod.";
          exit 1;
        fi;
        mkdir -p /tmp/nginx-dev-certs;
        cert_file=/tmp/nginx-dev-certs/tls.crt;
        key_file=/tmp/nginx-dev-certs/tls.key;
        openssl req -x509 -nodes -newkey rsa:2048 -days 2 -subj "/CN=localhost" \
          -keyout "$$key_file" -out "$$cert_file" >/dev/null 2>&1;
        config_file=/tmp/nginx.generated.conf;
        sed \
          -e "s|ssl_certificate     /etc/nginx/certs/tls.crt;|ssl_certificate     $$cert_file;|g" \
          -e "s|ssl_certificate_key /etc/nginx/certs/tls.key;|ssl_certificate_key $$key_file;|g" \
          /etc/nginx/nginx.conf > "$$config_file";
        echo "Generated temporary self-signed TLS cert for non-prod env=$$app_env";
      fi;
      exec nginx -c "$$config_file" -g "daemon off;";
      '
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./app/ui:/usr/share/nginx/html/ui:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -c /etc/nginx/nginx.conf || nginx -t -c /tmp/nginx.generated.conf"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --pool=prefork --concurrency=2
    stop_grace_period: 60s
    environment:
      <<: *common-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping --timeout 5 2>/dev/null | grep -q 'pong'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bidexpert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: bidexpert
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidexpert -d bidexpert"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      BIDEXPERT_DATABASE_URL: postgresql+psycopg://bidexpert:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bidexpert
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pg-backup:
    image: postgres:16
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/scripts/pg_backup.sh"]
    environment:
      BACKUP_DIR: /backups
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bidexpert
      DB_USER: bidexpert
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./backups:/backups
    restart: "no"

  qdrant-backup:
    image: alpine:3.20
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/scripts/qdrant_backup.sh"]
    environment:
      BACKUP_DIR: /backups
      QDRANT_STORAGE_DIR: /qdrant/storage
    volumes:
      - ./deploy/backup:/scripts:ro
      - qdrant_data:/qdrant/storage:ro
      - ./backups:/backups
    restart: "no"

  data-backup:
    image: alpine:3.20
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/scripts/data_backup.sh"]
    environment:
      BACKUP_DIR: /backups
      DATA_DIR: /data
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./data:/data:ro
      - ./backups:/backups
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.12.5
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  qdrant_data:
