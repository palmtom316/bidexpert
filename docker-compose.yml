services:
  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      BIDEXPERT_DATABASE_URL: postgresql+psycopg://bidexpert:bidexpert@postgres:5432/bidexpert
      BIDEXPERT_MIN_MATRIX_COVERAGE: "0.9"
      BIDEXPERT_CELERY_BROKER_URL: redis://redis:6379/0
      BIDEXPERT_CELERY_RESULT_BACKEND: redis://redis:6379/1
      BIDEXPERT_QDRANT_URL: http://qdrant:6333
      BIDEXPERT_UPLOAD_DIR: /app/data/uploads
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./data:/app/data

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    environment:
      BIDEXPERT_DATABASE_URL: postgresql+psycopg://bidexpert:bidexpert@postgres:5432/bidexpert
      BIDEXPERT_MIN_MATRIX_COVERAGE: "0.9"
      BIDEXPERT_CELERY_BROKER_URL: redis://redis:6379/0
      BIDEXPERT_CELERY_RESULT_BACKEND: redis://redis:6379/1
      BIDEXPERT_QDRANT_URL: http://qdrant:6333
      BIDEXPERT_UPLOAD_DIR: /app/data/uploads
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bidexpert
      POSTGRES_PASSWORD: bidexpert
      POSTGRES_DB: bidexpert
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
